<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentBot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>StudentBot</h1>
      <p>Бот для помощи студентам</p>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="message bot">
        Привет! Я StudentBot 🤖<br>
        Я могу помочь с HTML, CSS, JavaScript, Python и информатикой.<br><br>
        Попробуй написать:<br>
        <b>что такое html</b><br>
        <b>что такое css</b><br>
        <b>что такое python</b><br>
        <b>помоги с учебой</b>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Напиши сообщение..." />
      <button id="send-btn">Отправить</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
